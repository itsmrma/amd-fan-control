name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  core:
    name: Portable Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo fmt --all --check
      - run: cargo test --locked -p fan-core -p amd-adl -p fan-cli
      - name: Install GLib security test dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev pkg-config
      - name: GLib iterator security regression (optimized)
        run: cargo test --locked --release -p glib-security-regression

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: npm ci
      - run: npm run build
      - name: Browser regression tests (mocked GPU)
        run: |
          npx playwright install chromium
          npm run test:ui
      - name: Rust tests (no hardware writes)
        run: cargo test --locked --workspace
      - name: Rust lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build MSI and NSIS installer
        run: npm run tauri build -- --bundles msi,nsis
      - name: Build diagnostic CLI
        run: cargo build --locked --release -p fan-cli
      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable | Out-Null
          Copy-Item target/release/amd-fan-control.exe,target/release/fan-cli.exe portable/
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md portable/
          Copy-Item docs/TESTING.md portable/TESTING.md
          Copy-Item config.example.json portable/
          Compress-Archive -Path portable/* -DestinationPath amd-fan-control-windows-x64-portable.zip
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item target/release/bundle/msi/*.msi release/
          Copy-Item target/release/bundle/nsis/*-setup.exe release/
          Copy-Item amd-fan-control-windows-x64-portable.zip release/
          # GitHub replaces spaces with dots in asset names. Normalize before
          # hashing so SHA256SUMS refers to the actual downloadable filenames.
          Get-ChildItem release -File | ForEach-Object {
            if ($_.Name.Contains(' ')) {
              Rename-Item -LiteralPath $_.FullName -NewName $_.Name.Replace(' ', '.')
            }
          }
          Get-ChildItem release -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content -Path release/SHA256SUMS.txt -Encoding utf8
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/')
    needs: [core, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64
          path: release
      - name: Publish alpha assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --prerelease --title "AMD Fan Control $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --prerelease --title "AMD Fan Control $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          fi
