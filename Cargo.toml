[workspace]
members = ["crates/fan-core", "crates/amd-adl", "crates/fan-cli", "src-tauri"]
default-members = ["crates/fan-core", "crates/amd-adl", "crates/fan-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"

